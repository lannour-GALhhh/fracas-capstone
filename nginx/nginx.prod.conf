upstream django {
    # Compose service name -- this is the network alias. Not the image name
    # (fracas-backend) and not the container name (fracas-backend-1).
    server backend:8000;
}

server {
    listen 80;
    # The Azure VM hostname; `_` keeps it answering requests by raw IP / any other Host.
    server_name fracas-capstone.eastasia.cloudapp.azure.com _;

    client_max_body_size 20M;

    # Compress API JSON and any proxied text/JS/CSS. gzip_proxied any is required
    # because every response here comes back through proxy_pass.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

    # Django serves its assets (incl. the admin CSS/JS) under STATIC_URL=/static/.
    location /static/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
    }

    location /media {
        alias /backend/media/;
    }

    # GIS layer uploads (zipped shapefiles) are large; only this path gets the higher cap.
    location /api/admin/gis-imports/ {
        client_max_body_size 210M;
        proxy_read_timeout 300s;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA owns /admin (its in-app console); Django's admin lives at
    # /django-admin/ so a hard refresh on an /admin route hits the SPA, not Django.
    location /django-admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
    }
}