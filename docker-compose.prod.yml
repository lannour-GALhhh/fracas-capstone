# Single-VM production stack:  docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# No bind mounts, no dev server. Celery worker + beat run tasks and the periodic schedule
# (backend/schedules.py); the /api/cron/* HTTP endpoints remain as a manual fallback.
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    env_file: .env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    expose: ["6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "2"
    command: sh build.sh        # migrate, collectstatic, ensure_superuser, gunicorn
    restart: unless-stopped
    volumes:
      - media_volume:/backend/media
      - gis_import_volume:/backend/gis_imports
    expose: ["8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  celery_worker:
    build: ./backend
    env_file: .env
    command: celery -A backend worker -l info --concurrency 2
    restart: unless-stopped
    volumes:
      - media_volume:/backend/media
      - gis_import_volume:/backend/gis_imports
    depends_on:
      backend: { condition: service_healthy }

  celery_beat:
    build: ./backend
    env_file: .env
    command: celery -A backend beat -l info --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    depends_on:
      - celery_worker

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_DOWNLOAD_URL: ${VITE_APP_DOWNLOAD_URL:-}
    restart: unless-stopped
    expose: ["5173"]

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/backend/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }

volumes:
  postgres_data:
  media_volume:
  gis_import_volume:
